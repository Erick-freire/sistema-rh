{% extends 'funcionarios/base.html' %}

{% block titulo %}Sem perfil{% endblock %}

{% block conteudo_sem_login %}
<div class="login-shell">
    <div class="card" style="max-width: 420px; text-align: center;">
        <h1 style="margin-bottom: 10px;">Sem acesso configurado</h1>
        <p style="color: var(--color-text-muted); font-size: 0.92rem;">
            Seu usuário ainda não está vinculado a um perfil de funcionário. Fale com o RH para liberar o seu acesso.
        </p>
        <form method="post" action="{% url 'logout' %}" style="margin-top: 20px;">
            {% csrf_token %}
            <button type="submit" class="btn-outline btn-bloco">Sair</button>
        </form>
    </div>
</div>
{% endblock %}
