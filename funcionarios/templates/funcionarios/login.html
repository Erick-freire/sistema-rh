<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Sistema RH</title>
</head>
<body>
    <form method="post">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Usuário">
        <input type="password" name="password" placeholder="Senha">

        <button type="submit">Entrar</button>

        {% if erro %}
            <p style="color: red;">{{ erro }}</p>
        {% endif %}
    </form>
</body>
</html>
