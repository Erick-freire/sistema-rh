{% extends 'funcionarios/base.html' %}

{% block titulo %}
Login
{% endblock %}

{% block conteudo %}
<form method="post">
    {% csrf_token %}

    <input type="text" name="username" placeholder="Usuário">
    <input type="password" name="password" placeholder="Senha">

    <button type="submit">Entrar</button>

    {% if erro %}
        <p style="color: red;">{{ erro }}</p>
    {% endif %}
</form>
{% endblock %}
