{% extends 'funcionarios/base.html' %}

{% block titulo %}
Cadastrar Funcionário
{% endblock %}

{% block conteudo %}
<h1>Cadastrar Funcionário</h1>

<div class="card">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Cadastrar</button>
    </form>
</div>
{% endblock %}
