{% extends 'funcionarios/base.html' %}

{% block titulo %}
Trocar Senha
{% endblock %}

{% block conteudo %}
<h1>Defina sua nova senha</h1>

<p>Por segurança, você precisa definir uma senha própria antes de continuar.</p>

<div class="card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar nova senha</button>
    </form>
</div>
{% endblock %}
